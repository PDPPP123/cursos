/* =========================================================
   Rotas (#/, #/biblioteca, #/curso/ID, #/assistir/ID, #/ajustes)
   ========================================================= */
let navegouNoApp = false;
let rotaBase = null;

function lerRota() {
  const partes = location.hash.replace(/^#\/?/, '').split('/');
  return { rota: partes[0] || '', id: decodeURIComponent(partes[1] || '') };
}

async function rotear({ manterScroll = false } = {}) {
  const { rota, id } = lerRota();
  if (rota === 'assistir' && id) { await Player.abrir(id); return; }
  const vinhaDoPlayer = Player.ativo;
  Player.sair();
  const chave = rota + '/' + id;
  const manter = manterScroll || (vinhaDoPlayer && rotaBase === chave && app.childElementCount > 0);
  const y = window.scrollY;
  rotaBase = chave;
  $('#btn-voltar').hidden = rota !== 'curso';
  $$('[data-aba]').forEach((el) => el.classList.toggle('ativo', el.dataset.aba === (rota === 'curso' ? '' : rota)));
  const token = ++tokenTela;
  if (rota === 'curso') await telaCurso(id, token);
  else if (rota === 'biblioteca') await telaBiblioteca(token);
  else if (rota === 'ajustes') await telaAjustes(token);
  else await telaInicio(token);
  if (token !== tokenTela) return;
  window.scrollTo(0, manter ? y : 0);
  atualizarTopo();
  document.title = rota === 'curso' ? ($('.curso-info h1')?.textContent || APP) + ' · ' + APP
    : rota === 'biblioteca' ? 'Biblioteca · ' + APP : rota === 'ajustes' ? 'Ajustes · ' + APP : APP;
}

const rerenderizar = () => rotear({ manterScroll: true });

function voltar(padrao = '#/') {
  if (navegouNoApp && history.length > 1) history.back();
  else location.replace(padrao);
}

// Cabeçalho sólido ao rolar (e sempre nas páginas sem imagem de fundo)
function atualizarTopo() {
  const r = lerRota().rota;
  $('#topo').classList.toggle('solido', window.scrollY > 30 || r === 'ajustes' || r === 'biblioteca');
}

window.addEventListener('hashchange', () => { navegouNoApp = true; rotear(); });
window.addEventListener('scroll', atualizarTopo, { passive: true });

/* =========================================================
   Player
   ========================================================= */
const Player = {
  ativo: false, aula: null, curso: null, lista: [], prog: null, url: null,
  retomado: false, bloqueioAuto: false, token: 0, contagemTimer: null, posAlvo: 0, ultimaSessao: 0,
  get v() { return $('#video'); },

  init() {
    const v = this.v;
    v.addEventListener('loadedmetadata', () => this.aoCarregar());
    v.addEventListener('canplay', () => {
      // iOS às vezes ignora o seek feito cedo demais; reaplica uma vez
      if (this.posAlvo > 0 && v.currentTime < 1) { try { v.currentTime = this.posAlvo; } catch (e) {} }
      this.posAlvo = 0;
    });
    v.addEventListener('timeupdate', () => this.aoTempo());
    v.addEventListener('pause', () => this.salvar());
    v.addEventListener('play', () => this.pararContagem());
    v.addEventListener('ended', () => this.aoTerminar());
    v.addEventListener('ratechange', () => {
      if (!this.ativo || !this.retomado) return;
      // Também guarda a velocidade escolhida pelos controles nativos
      if (VELOCIDADES.includes(v.playbackRate)) { salvarPref('velocidade', v.playbackRate); v.defaultPlaybackRate = v.playbackRate; }
      this.rotuloVelocidade();
    });
    v.addEventListener('error', () => {
      if (!this.aula || !v.getAttribute('src')) return;
      this.mostrarErro(`Não foi possível reproduzir este vídeo neste aparelho.<br><small>Formato: .${esc(this.aula.ext)}. No iPhone, prefira MP4 com H.264/AAC.</small>`);
    });
    // Salva a posição a cada 5 s e ao sair/ocultar o app
    setInterval(() => { if (this.ativo && !v.paused) this.salvar(); }, 5000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') this.salvar(); });
    window.addEventListener('pagehide', () => this.salvar());
    this.configurarSessao();
    this.rotuloVelocidade();
  },

  async abrir(id) {
    if (!this.ativo) {
      this.ativo = true;
      $('#player').hidden = false;
      document.body.classList.add('com-player');
    }
    await this.carregarAula(id);
  },

  async carregarAula(id) {
    const token = ++this.token;
    await this.salvar();
    this.pararContagem();
    $('#pl-erro').hidden = true;
    const aula = await DB.get('aulas', id);
    if (token !== this.token) return;
    if (!aula) { toast('Episódio não encontrado'); location.replace('#/'); return; }
    const [curso, aulas, prog] = await Promise.all([DB.get('cursos', aula.cursoId), DB.aulasDoCurso(aula.cursoId), DB.get('progresso', id)]);
    if (token !== this.token) return;
    this.aula = aula; this.curso = curso || { id: aula.cursoId, nome: '' };
    this.lista = ordenarAulas(aulas);
    this.prog = prog || { aulaId: id, posicao: 0, concluida: false, atualizadoEm: 0 };
    this.retomado = false; this.bloqueioAuto = false; this.posAlvo = 0;

    const idx = this.lista.findIndex((a) => a.id === id);
    $('#pl-curso').textContent = [this.curso.nome, aula.modulo].filter(Boolean).join(' · ');
    $('#pl-aula').innerHTML = `<span class="n">E${idx + 1}</span>${esc(aula.titulo)}`;
    document.title = aula.titulo + ' · ' + APP;
    $('#pl-anterior').disabled = idx <= 0;
    $('#pl-proxima').disabled = idx < 0 || idx >= this.lista.length - 1;
    this.atualizarBotaoConcluida();
    this.renderLista();

    const v = this.v;
    let arquivo;
    try { arquivo = await OPFS.arquivo(aula.caminho); }
    catch (e) {
      if (token !== this.token) return;
      v.removeAttribute('src'); v.load();
      this.mostrarErro('O arquivo deste vídeo não foi encontrado no aparelho. Importe o curso novamente.');
      return;
    }
    if (token !== this.token) return;
    // Troca de episódio: revoga a URL anterior
    if (this.url) URL.revokeObjectURL(this.url);
    this.url = URL.createObjectURL(arquivo.slice(0, arquivo.size, EXT_VIDEO[aula.ext] || 'video/mp4'));
    v.defaultPlaybackRate = lerPref('velocidade', 1);
    v.src = this.url;
    this.atualizarSessao();
    const tentativa = v.play();
    if (tentativa && tentativa.catch) tentativa.catch(() => {}); // sem gesto o navegador pode bloquear: o usuário toca no play
  },

  aoCarregar() {
    if (!this.aula) return;
    const v = this.v, d = v.duration;
    const vel = lerPref('velocidade', 1);
    v.defaultPlaybackRate = vel; v.playbackRate = vel;
    // Retoma de onde parou; se faltar menos de 10 s, começa do início
    let pos = this.prog.posicao || 0;
    if (!isFinite(d) || d - pos <= 10) pos = 0;
    if (pos > 0) { try { v.currentTime = pos; } catch (e) {} this.posAlvo = pos; }
    this.retomado = true;
    if (isFinite(d) && d > 0 && Math.abs((this.aula.duracao || 0) - d) > 1) {
      this.aula.duracao = d;
      DB.get('aulas', this.aula.id).then((a) => { if (a) { a.duracao = d; return DB.put('aulas', a); } }).catch(() => {});
    }
    this.rotuloVelocidade();
    this.posicaoSessao(true);
  },

  aoTempo() {
    if (!this.retomado || !this.aula) return;
    const v = this.v, d = v.duration;
    // Concluída ao atingir 90%
    if (isFinite(d) && d > 0 && !this.prog.concluida && !this.bloqueioAuto && v.currentTime / d >= 0.9) {
      this.prog.concluida = true;
      this.salvar();
      this.atualizarBotaoConcluida();
      this.renderLista();
    }
    this.posicaoSessao();
  },

  async salvar() {
    const aula = this.aula, v = this.v;
    if (!this.ativo || !aula || !this.retomado) return;
    const d = v.duration;
    if (!isFinite(d) || d <= 0) return;
    this.prog = { ...this.prog, aulaId: aula.id, posicao: v.currentTime, duracao: d, atualizadoEm: Date.now() };
    try { await DB.put('progresso', this.prog); } catch (e) {}
  },

  async aoTerminar() {
    if (!this.aula) return;
    if (!this.bloqueioAuto) this.prog.concluida = true;
    await this.salvar();
    this.atualizarBotaoConcluida();
    this.renderLista();
    const prox = this.vizinha(1);
    if (prox) this.iniciarContagem(prox);
  },

  vizinha(delta) {
    const i = this.lista.findIndex((a) => a.id === this.aula?.id);
    return i < 0 ? null : this.lista[i + delta] || null;
  },

  irPara(aula) { if (aula) location.replace('#/assistir/' + encodeURIComponent(aula.id)); },

  // Próximo episódio com contagem de 5 s cancelável
  iniciarContagem(prox) {
    this.pararContagem();
    let n = 5;
    const anel = $('#cont-anel');
    const idx = this.lista.indexOf(prox) + 1;
    $('#cont-num').textContent = n;
    $('#cont-titulo').textContent = `E${idx} · ${prox.titulo}`;
    const mini = urlsMini.get(prox.id);
    $('#contagem').style.backgroundImage = mini ? `url('${mini}')` : '';
    anel.style.transition = 'none'; anel.style.strokeDashoffset = '0';
    $('#contagem').hidden = false;
    requestAnimationFrame(() => { anel.style.transition = ''; anel.style.strokeDashoffset = String(176 / 5); });
    this.contagemTimer = setInterval(() => {
      n--;
      $('#cont-num').textContent = n;
      anel.style.strokeDashoffset = String(176 * Math.min(1, (6 - n) / 5));
      if (n <= 0) { this.pararContagem(); this.irPara(prox); }
    }, 1000);
  },
  pararContagem() { clearInterval(this.contagemTimer); this.contagemTimer = null; $('#contagem').hidden = true; },

  pular(seg) {
    const v = this.v;
    if (!isFinite(v.duration)) return;
    v.currentTime = Math.max(0, Math.min(v.duration - 0.1, v.currentTime + seg));
  },

  trocarVelocidade() {
    const atual = lerPref('velocidade', 1);
    const prox = VELOCIDADES[(VELOCIDADES.indexOf(atual) + 1) % VELOCIDADES.length];
    salvarPref('velocidade', prox);
    this.v.defaultPlaybackRate = prox; this.v.playbackRate = prox;
    this.rotuloVelocidade();
    toast('Velocidade ' + String(prox).replace('.', ',') + 'x', 1200);
  },
  rotuloVelocidade() { $('#pl-vel').textContent = String(lerPref('velocidade', 1)).replace('.', ',') + 'x'; },

  async alternarConcluida() {
    if (!this.aula) return;
    this.prog.concluida = !this.prog.concluida;
    this.bloqueioAuto = !this.prog.concluida; // desmarcou na mão: não remarca sozinho neste episódio
    this.prog.atualizadoEm = Date.now();
    await DB.put('progresso', { ...this.prog, aulaId: this.aula.id });
    this.atualizarBotaoConcluida();
    this.renderLista();
    toast(this.prog.concluida ? 'Marcado como assistido' : 'Desmarcado', 1400);
  },
  atualizarBotaoConcluida() {
    const b = $('#pl-concluida');
    const sim = !!this.prog?.concluida;
    b.classList.toggle('sim', sim);
    b.title = sim ? 'Desmarcar como assistido' : 'Marcar como assistido';
    b.setAttribute('aria-label', b.title);
  },

  async renderLista() {
    if (!this.aula) return;
    const aulaAtual = this.aula;
    const [progs] = await Promise.all([DB.todos('progresso'), miniaturas(this.lista)]);
    if (this.aula !== aulaAtual) return;
    const prog = new Map(progs.map((p) => [p.aulaId, p]));
    prog.set(this.aula.id, this.prog);
    const prox = this.vizinha(1);
    $('#pl-prox').innerHTML = prox ? `<button class="pl-prox" data-acao="assistir" data-id="${prox.id}">
        ${thumbEp(prox, this.lista.indexOf(prox) + 1, prog.get(prox.id))}
        <div><small>Próximo episódio</small><div class="t">E${this.lista.indexOf(prox) + 1} · ${esc(prox.titulo)}</div></div></button>` : '';
    let html = `<h3>Episódios · ${esc(this.curso.nome)}</h3>`, modAtual = null;
    const variosMods = new Set(this.lista.map((a) => a.modulo)).size > 1;
    this.lista.forEach((a, i) => {
      if (variosMods && a.modulo !== modAtual) { modAtual = a.modulo; html += `<h4>${esc(nomeModulo(a.modulo))}</h4>`; }
      html += linhaEp(a, prog.get(a.id), i + 1, a.id === this.aula.id);
    });
    $('#pl-lista').innerHTML = html;
  },

  mostrarErro(html) { const e = $('#pl-erro'); e.innerHTML = `<div>${html}</div>`; e.hidden = false; },

  sair() {
    if (!this.ativo) return;
    this.salvar();
    this.token++;
    this.pararContagem();
    const v = this.v;
    this.ativo = false; this.aula = null;
    v.pause(); v.removeAttribute('src'); v.load();
    if (this.url) { URL.revokeObjectURL(this.url); this.url = null; }
    $('#player').hidden = true;
    document.body.classList.remove('com-player');
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    if ('mediaSession' in navigator) navigator.mediaSession.metadata = null;
    Processador.rodar();
  },

  fechar() { const cid = this.curso?.id; voltar(cid ? '#/curso/' + encodeURIComponent(cid) : '#/'); },

  // Media Session: título na tela de bloqueio e botões de mídia
  configurarSessao() {
    if (!('mediaSession' in navigator)) return;
    const v = this.v;
    const acoes = {
      play: () => v.play(),
      pause: () => v.pause(),
      seekbackward: (d) => this.pular(-(d.seekOffset || 10)),
      seekforward: (d) => this.pular(d.seekOffset || 10),
      seekto: (d) => { if (d.fastSeek && 'fastSeek' in v) v.fastSeek(d.seekTime); else v.currentTime = d.seekTime; },
      previoustrack: () => this.irPara(this.vizinha(-1)),
      nexttrack: () => this.irPara(this.vizinha(1))
    };
    for (const [acao, fn] of Object.entries(acoes)) { try { navigator.mediaSession.setActionHandler(acao, fn); } catch (e) {} }
  },
  async atualizarSessao() {
    if (!('mediaSession' in navigator) || !this.aula) return;
    const url = await capaUrl(this.curso);
    const mini = urlsMini.get(this.aula.id);
    const arte = url ? [{ src: url }] : mini ? [{ src: mini, sizes: '320x180', type: 'image/jpeg' }] : [{ src: arteGerada(this.curso), sizes: '512x512', type: 'image/png' }];
    const idx = this.lista.findIndex((a) => a.id === this.aula.id) + 1;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: `E${idx} · ${this.aula.titulo}`, artist: this.curso.nome, album: nomeModulo(this.aula.modulo), artwork: arte
      });
    } catch (e) {}
  },
  posicaoSessao(forcar) {
    if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
    const agora = Date.now();
    if (!forcar && agora - this.ultimaSessao < 4000) return;
    this.ultimaSessao = agora;
    const v = this.v;
    if (!isFinite(v.duration) || v.duration <= 0) return;
    try { navigator.mediaSession.setPositionState({ duration: v.duration, playbackRate: v.playbackRate || 1, position: Math.min(v.currentTime, v.duration) }); } catch (e) {}
  }
};

/* =========================================================
   Importação
   ========================================================= */
let importando = false;
let wakeLock = null;

function criarWorker() {
  const src = $('#worker-src').textContent;
  const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  const w = new Worker(url);
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return w;
}

const Importador = {
  async deZips(files) {
    const planos = [], erros = [];
    for (const f of files) {
      if (!/\.zip$/i.test(f.name)) { erros.push(`${f.name}: não é um arquivo .zip`); continue; }
      try {
        const entradas = await ZIP.ler(f);
        const itens = entradas.filter((e) => !e.pasta).map((e) => ({
          caminho: e.nome, tamanho: e.tamanho, data: e.data,
          fonte: { tipo: 'zip', file: f, offLocal: e.offLocal, metodo: e.metodo, comp: e.comp },
          obs: (e.flags & 1) ? 'protegido por senha'
            : (e.metodo !== 0 && e.metodo !== 8) ? 'método de compressão não suportado'
            : (e.metodo === 8 && !SUPORTE.deflate) ? 'zip com compressão não suportado neste navegador — recrie o zip sem compressão'
            : null
        }));
        planos.push(planejar(nomeDoZip(f.name), itens));
      } catch (err) { erros.push(`${f.name}: ${err.message}`); }
    }
    await this.executar(planos, erros);
  },

  async dePasta(files) {
    // webkitRelativePath = "Pasta do curso/Módulo/aula.mp4"
    const grupos = new Map();
    for (const f of files) {
      const rel = (f.webkitRelativePath || f.name).replace(/\\/g, '/');
      const partes = rel.split('/');
      const curso = partes.length > 1 ? partes[0] : 'Curso';
      if (!grupos.has(curso)) grupos.set(curso, []);
      grupos.get(curso).push({ caminho: partes.slice(partes.length > 1 ? 1 : 0).join('/'), tamanho: f.size, data: f.lastModified, fonte: { tipo: 'arquivo', file: f } });
    }
    const planos = [...grupos].map(([nome, itens]) => planejar(nome.replace(/_+/g, ' ').trim(), itens));
    await this.executar(planos, []);
  },

  async executar(planos, erros) {
    if (!SUPORTE.opfs) {
      await dialogo({ titulo: 'Sem suporte', html: '<p>Este navegador não permite guardar arquivos. Use Safari (iOS 16.4+) ou Chrome/Edge, por https ou localhost.</p>' });
      return;
    }
    const cursos = await DB.todos('cursos');
    const tarefas = [], metas = [], novos = [];
    let jaExistiam = 0;
    for (const p of planos) {
      let curso = cursos.find((c) => c.nome.toLocaleLowerCase('pt-BR') === p.nomeCurso.toLocaleLowerCase('pt-BR'));
      let existentes = new Set(), baseOrdem = 0;
      if (curso && !novos.includes(curso)) {
        const ja = await DB.aulasDoCurso(curso.id);
        existentes = new Set(ja.map((a) => a.origem));
        baseOrdem = ja.reduce((m, a) => Math.max(m, (a.ordem ?? -1) + 1), 0); // novas aulas entram depois
      }
      if (!curso) {
        curso = { id: novoId(), nome: p.nomeCurso, capa: null, criadoEm: Date.now() };
        cursos.push(curso); novos.push(curso);
      }
      if (p.capa && !curso.capa && !curso._capaPendente) {
        curso._capaPendente = true;
        const destino = `cursos/${curso.id}/capa.${p.capa.ext}`;
        tarefas.push({ fonte: p.capa.fonte, destino, tamanho: p.capa.tamanho, rotulo: 'Capa', curso: curso.nome });
        metas.push({ tipo: 'capa', cursoId: curso.id, caminho: destino });
      }
      for (const v of p.videos) {
        if (existentes.has(v.rel)) { jaExistiam++; continue; } // reimportar continua de onde parou
        existentes.add(v.rel);
        const id = novoId();
        const destino = `cursos/${curso.id}/${id}.${v.ext}`;
        tarefas.push({ fonte: v.fonte, destino, tamanho: v.tamanho, rotulo: v.titulo, curso: curso.nome });
        metas.push({ tipo: 'aula', aula: { id, cursoId: curso.id, modulo: v.modulo, titulo: v.titulo, origem: v.rel, ordem: baseOrdem + v.ordem, caminho: destino, ext: v.ext, tamanho: v.tamanho, duracao: null, criadoEm: Date.now() } });
      }
    }
    const ignorados = planos.flatMap((p) => p.ignorados.map((i) => ({ ...i, curso: p.nomeCurso })));
    const ocultos = planos.reduce((s, p) => s + p.ocultos, 0);
    const semVideo = planos.filter((p) => !p.videos.length).map((p) => p.nomeCurso);

    if (!metas.some((m) => m.tipo === 'aula')) {
      novos.forEach((c) => delete c._capaPendente);
      await this.relatorio({ ok: 0, cursos: 0, jaExistiam, ignorados, ocultos, erros, falhas: [], semVideo });
      return;
    }

    // Confere espaço antes de começar (o limite é do navegador)
    const total = tarefas.reduce((s, t) => s + t.tamanho, 0);
    try {
      const est = await navigator.storage.estimate();
      const livre = (est.quota || 0) - (est.usage || 0);
      if (est.quota && total > livre * 0.97) {
        const seguir = await confirmar('Pode faltar espaço',
          `<p>Esta importação precisa de <b>${fmtBytes(total)}</b>, mas o navegador informa <b>${fmtBytes(livre)}</b> livres para o app.</p>
           <p>${SUPORTE.ios && !SUPORTE.instalado ? 'No iPhone, <b>instale o app na Tela de Início</b> para liberar muito mais espaço. ' : ''}Você também pode apagar cursos já assistidos em Ajustes.</p>`,
          'Tentar mesmo assim');
        if (!seguir) return;
      }
    } catch (e) {}
    try { await navigator.storage.persist(); } catch (e) {}

    for (const c of novos) { const { _capaPendente, ...limpo } = c; await DB.put('cursos', limpo); }
    const resultado = await this.rodarWorker(tarefas, metas, total);
    novos.forEach((c) => delete c._capaPendente);

    // Cursos novos que ficaram vazios (cancelado/erro) são removidos
    for (const c of novos) {
      const aulas = await DB.aulasDoCurso(c.id);
      if (!aulas.length) { await DB.apagar([], c.id); await OPFS.remover('cursos/' + c.id); esquecerCapa(c.id); }
    }
    const okAulas = metas.filter((m, i) => m.tipo === 'aula' && resultado.ok.has(i)).map((m) => m.aula);
    rerenderizar();
    await this.relatorio({
      ok: okAulas.length, cursos: new Set(okAulas.map((a) => a.cursoId)).size, jaExistiam, ignorados, ocultos, erros,
      falhas: resultado.falhas, cancelado: resultado.cancelado, semEspaco: resultado.semEspaco, semVideo
    });
    Processador.adicionar(okAulas); // duração e miniaturas em segundo plano
  },

  rodarWorker(tarefas, metas, total) {
    return new Promise(async (resolve) => {
      importando = true;
      try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) { wakeLock = null; }
      const m = abrirModal(`<h2>Importando</h2>
        <div class="modal-corpo">
          <div class="imp-pct" id="imp-pct">0%</div>
          <div class="imp-arquivo" id="imp-arquivo"></div>
          <div class="imp-curso" id="imp-curso"></div>
          <div class="barra grossa"><i id="imp-barra" style="width:0%"></i></div>
          <div class="imp-nums"><span id="imp-bytes"></span><span id="imp-vel"></span></div>
          <p style="margin-top:16px;font-size:13px">Mantenha o app aberto e a tela ligada até terminar.</p>
        </div>
        <div class="modal-botoes"><button class="btn btn-sec" id="imp-cancelar">Cancelar</button></div>`, { fechavel: false });

      const w = criarWorker();
      const ok = new Set(), falhas = [];
      let concluidos = 0, feitoAtual = 0, atual = 0, fila = Promise.resolve(), terminado = false;
      const inicio = Date.now();

      const pintar = () => {
        const feito = concluidos + feitoAtual;
        const pct = total ? Math.min(100, (feito / total) * 100) : 0;
        $('#imp-pct').textContent = Math.floor(pct) + '%';
        $('#imp-barra').style.width = pct.toFixed(2) + '%';
        const t = tarefas[Math.min(atual, tarefas.length - 1)];
        $('#imp-arquivo').textContent = `${Math.min(atual + 1, tarefas.length)} de ${tarefas.length} · ${t.rotulo}`;
        $('#imp-curso').textContent = t.curso;
        $('#imp-bytes').textContent = `${fmtBytes(feito)} de ${fmtBytes(total)}`;
        const seg = (Date.now() - inicio) / 1000;
        if (seg > 2 && feito > 0) {
          const vel = feito / seg, resta = (total - feito) / vel;
          $('#imp-vel').textContent = `${fmtBytes(vel)}/s · ~${resta > 90 ? Math.ceil(resta / 60) + ' min' : Math.ceil(resta) + ' s'}`;
        }
      };
      pintar();

      const finalizar = async (extra = {}) => {
        if (terminado) return;
        terminado = true;
        await fila;
        w.terminate();
        m.fechar();
        importando = false;
        try { await wakeLock?.release(); } catch (e) {}
        wakeLock = null;
        resolve({ ok, falhas, ...extra });
      };

      // Cada item gravado vira registro na hora: se cancelar, o que já foi importado fica
      const gravarMeta = async (meta) => {
        if (meta.tipo === 'aula') await DB.put('aulas', meta.aula);
        else {
          const c = await DB.get('cursos', meta.cursoId);
          if (c) { c.capa = meta.caminho; await DB.put('cursos', c); }
        }
      };

      w.onmessage = ({ data: msg }) => {
        if (terminado) return;
        if (msg.tipo === 'progresso') { atual = msg.indice; feitoAtual = msg.feito; pintar(); }
        else if (msg.tipo === 'itemOk') {
          const i = msg.indice;
          concluidos += tarefas[i].tamanho; feitoAtual = 0; atual = i + 1;
          fila = fila.then(() => gravarMeta(metas[i])).then(() => ok.add(i)).catch((e) => falhas.push({ nome: tarefas[i].rotulo, mensagem: 'Erro ao salvar: ' + e.message }));
          pintar();
        } else if (msg.tipo === 'itemErro') {
          const i = msg.indice;
          concluidos += tarefas[i].tamanho; feitoAtual = 0; atual = i + 1;
          falhas.push({ nome: tarefas[i].rotulo, mensagem: msg.mensagem });
          pintar();
          if (msg.fatal) finalizar({ semEspaco: true });
        } else if (msg.tipo === 'falha') {
          falhas.push({ nome: 'Importação', mensagem: msg.mensagem });
          finalizar();
        } else if (msg.tipo === 'fim') finalizar();
      };
      w.onerror = (e) => { falhas.push({ nome: 'Importação', mensagem: e.message || 'Erro no worker' }); finalizar(); };

      $('#imp-cancelar').addEventListener('click', async () => {
        const sim = await confirmar('Cancelar importação?', '<p>O que já foi importado fica salvo. Para continuar depois, importe o mesmo zip de novo — o que já existe é pulado.</p>', 'Cancelar importação', true);
        if (!sim || terminado) return;
        w.terminate();
        const parcial = tarefas[atual];
        if (parcial && !ok.has(atual)) await OPFS.remover(parcial.destino); // apaga o arquivo pela metade
        finalizar({ cancelado: true });
      });

      w.postMessage({ tipo: 'extrair', tarefas: tarefas.map(({ fonte, destino, tamanho }) => ({ fonte, destino, tamanho })) });
    });
  },

  async relatorio(r) {
    const partes = [];
    if (r.ok) partes.push(`<div class="sucesso"><span>${ICONE.check}</span><div><b>${plural(r.ok, 'episódio importado', 'episódios importados')}</b><br><small style="color:var(--txt2)">em ${plural(r.cursos, 'curso', 'cursos')}</small></div></div>`);
    else if (!r.cancelado) partes.push(`<p>Nenhum episódio novo foi importado.</p>`);
    if (r.cancelado) partes.push(`<p><b>Importação cancelada.</b> O que já foi copiado ficou salvo.</p>`);
    if (r.jaExistiam) partes.push(`<p>${plural(r.jaExistiam, 'episódio já existia e foi pulado', 'episódios já existiam e foram pulados')}.</p>`);
    if (r.semVideo?.length) partes.push(`<p>Sem vídeos compatíveis em: ${r.semVideo.map(esc).join(', ')}.</p>`);
    if (r.semEspaco) partes.push(`<div class="alerta">O armazenamento encheu. Apague cursos já assistidos em Ajustes e importe de novo — o que já foi salvo será pulado.</div>`);
    if (r.erros?.length) partes.push(`<div class="alerta">${r.erros.map(esc).join('<br>')}</div>`);
    if (r.falhas?.length) partes.push(`<details open><summary>${plural(r.falhas.length, 'falha', 'falhas')}</summary><ul>${r.falhas.map((f) => `<li>${esc(f.nome)} — ${esc(f.mensagem)}</li>`).join('')}</ul></details>`);
    if (r.ignorados?.length) {
      partes.push(`<details><summary>${plural(r.ignorados.length, 'arquivo ignorado', 'arquivos ignorados')}</summary><ul>${r.ignorados.slice(0, 300).map((i) => `<li>${esc(i.caminho)} — <i>${esc(i.motivo)}</i></li>`).join('')}${r.ignorados.length > 300 ? `<li>… e mais ${r.ignorados.length - 300}</li>` : ''}</ul></details>`);
    }
    if (r.ocultos) partes.push(`<p style="font-size:13px">${plural(r.ocultos, 'arquivo oculto/de sistema ignorado', 'arquivos ocultos/de sistema ignorados')} (ex.: __MACOSX).</p>`);
    const semTocar = [...new Set((r.ignorados || []).filter((i) => EXT_NAO_TOCA.includes(i.ext)).map((i) => i.ext.toUpperCase()))];
    if (semTocar.length) partes.push(`<div class="alerta"><b>${semTocar.join(', ')}</b> não ${semTocar.length > 1 ? 'tocam' : 'toca'} no iPhone. Converta para <b>MP4 (H.264 + AAC)</b> — por exemplo com o HandBrake, gratuito — e importe de novo.</div>`);
    await dialogo({ titulo: r.cancelado ? 'Importação interrompida' : 'Importação concluída', html: partes.join('') });
  }
};

async function menuImportar() {
  if (importando) return;
  if (!SUPORTE.pasta) { $('#inp-zip').click(); return; }
  const escolha = await dialogo({
    titulo: 'Importar curso',
    html: `<div class="escolha">
      <button data-valor="zip"><span>${ICONE.zip}</span><div><b>Arquivos .zip</b><small>Um zip por curso. Pode escolher vários.</small></div></button>
      <button data-valor="pasta"><span>${ICONE.pasta}</span><div><b>Pasta</b><small>Uma pasta com os vídeos do curso.</small></div></button>
    </div><p style="margin:14px 0 0;font-size:13px">Dica: você também pode arrastar os zips para esta janela.</p>`,
    botoes: [{ rotulo: 'Cancelar', valor: null }]
  });

/* =========================================================
   Ações de dados
   ========================================================= */
async function apagarCurso(id) {
  const curso = await DB.get('cursos', id);
  if (!curso) return;
  const aulas = await DB.aulasDoCurso(id);
  const tam = aulas.reduce((s, a) => s + (a.tamanho || 0), 0);
  const ok = await confirmar('Apagar curso?', `<p>“${esc(curso.nome)}” será removido deste aparelho, com ${plural(aulas.length, 'episódio', 'episódios')} e o progresso. Isso libera <b>${fmtBytes(tam)}</b>.</p>`, 'Apagar curso', true);
  if (!ok) return;
  await DB.apagar(aulas.map((a) => a.id), id);
  await OPFS.remover('cursos/' + id);
  esquecerCapa(id); esquecerMinis(aulas.map((a) => a.id));
  estadoCurso.delete(id);
  toast('Curso apagado — ' + fmtBytes(tam) + ' liberados');
  if (lerRota().rota === 'curso') location.replace('#/'); else rerenderizar();
}

async function renomearCurso(id) {
  const curso = await DB.get('cursos', id);
  if (!curso) return;
  const m = abrirModal(`<h2>Renomear curso</h2>
    <div class="modal-corpo">
      <input id="novo-nome" class="campo" maxlength="80" value="${esc(curso.nome)}" autocomplete="off" enterkeyhint="done">
      <p style="margin-top:10px;font-size:13px">Para levar o progresso para outro aparelho, use o mesmo nome lá.</p>
    </div>
    <div class="modal-botoes"><button class="btn btn-sec" data-r="0">Cancelar</button><button class="btn btn-primario" data-r="1">Salvar</button></div>`);
  const campo = $('#novo-nome', m.el);
  setTimeout(() => { campo.focus(); campo.select(); }, 50);
  const salvar = async () => {
    const nome = campo.value.replace(/\s+/g, ' ').trim();
    if (!nome) { campo.focus(); return; }
    m.fechar();
    if (nome !== curso.nome) { curso.nome = nome; await DB.put('cursos', curso); toast('Curso renomeado'); rerenderizar(); }
  };
  m.el.addEventListener('click', (e) => { const b = e.target.closest('[data-r]'); if (!b) return; if (b.dataset.r === '1') salvar(); else m.fechar(); });
  campo.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); salvar(); } });
  m.fundo.addEventListener('fechar', () => m.fechar());
}

async function apagarModulo(cursoId, modulo) {
  const todas = await DB.aulasDoCurso(cursoId);
  const aulas = todas.filter((a) => a.modulo === modulo);
  if (!aulas.length) return;
  const tam = aulas.reduce((s, a) => s + (a.tamanho || 0), 0);
  const ok = await confirmar('Apagar módulo?', `<p>O módulo “${esc(nomeModulo(modulo))}” (${plural(aulas.length, 'episódio', 'episódios')}) será removido deste aparelho. Isso libera <b>${fmtBytes(tam)}</b>.</p>`, 'Apagar módulo', true);
  if (!ok) return;
  const restantes = todas.length - aulas.length;
  await DB.apagar(aulas.map((a) => a.id), restantes ? null : cursoId);
  for (const a of aulas) await OPFS.remover(a.caminho);
  esquecerMinis(aulas.map((a) => a.id));
  toast('Módulo apagado — ' + fmtBytes(tam) + ' liberados');
  if (!restantes) { await OPFS.remover('cursos/' + cursoId); esquecerCapa(cursoId); location.replace('#/'); }
  else rerenderizar();
}

async function alternarConcluida(aulaId) {
  if (Player.ativo && Player.aula?.id === aulaId) { await Player.alternarConcluida(); return; }
  const p = (await DB.get('progresso', aulaId)) || { aulaId, posicao: 0, concluida: false };
  p.concluida = !p.concluida;
  p.atualizadoEm = Date.now();
  await DB.put('progresso', p);
  if (Player.ativo) Player.renderLista(); else rerenderizar();
}

async function exportarProgresso() {
  const d = await carregarTudo();
  const cursoPorId = new Map(d.cursos.map((c) => [c.id, c]));
  const itens = [];
  for (const p of d.prog.values()) {
    const a = d.aulaMap.get(p.aulaId);
    const c = a && cursoPorId.get(a.cursoId);
    if (!c) continue;
    itens.push({ curso: c.nome, caminho: a.origem, posicao: Math.round(p.posicao || 0), concluida: !!p.concluida, atualizadoEm: p.atualizadoEm || 0 });
  }
  const json = JSON.stringify({ app: APP, versao: 1, exportadoEm: new Date().toISOString(), itens }, null, 2);
  const nome = `cursos-progresso-${new Date().toISOString().slice(0, 10)}.json`;
  const arquivo = new File([json], nome, { type: 'application/json' });
  // No iPhone, a folha de compartilhamento permite "Salvar em Arquivos"
  if (matchMedia('(pointer: coarse)').matches && navigator.canShare?.({ files: [arquivo] })) {
    try { await navigator.share({ files: [arquivo], title: 'Progresso · ' + APP }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(arquivo);
  const a = document.createElement('a');
  a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast(`Progresso exportado (${plural(itens.length, 'aula', 'aulas')})`);
}

async function importarProgresso(file) {
  let dados;
  try { dados = JSON.parse(await file.text()); } catch (e) { toast('Arquivo JSON inválido'); return; }
  if (!dados || !Array.isArray(dados.itens)) { toast('Este arquivo não é um progresso exportado por este app'); return; }
  const d = await carregarTudo();
  // Casa por nome do curso + caminho da aula
  const chave = (curso, caminho) => curso.toLocaleLowerCase('pt-BR') + '\u0000' + caminho;
  const cursoPorId = new Map(d.cursos.map((c) => [c.id, c]));
  const mapa = new Map(d.aulas.map((a) => [chave(cursoPorId.get(a.cursoId)?.nome || '', a.origem), a]));
  const novos = [];
  let casados = 0;
  for (const it of dados.itens) {
    const a = mapa.get(chave(String(it.curso || ''), String(it.caminho || '')));
    if (!a) continue;
    casados++;
    const atual = d.prog.get(a.id);
    if (atual && (atual.atualizadoEm || 0) > (it.atualizadoEm || 0)) continue; // mantém o mais recente
    novos.push({ aulaId: a.id, posicao: Number(it.posicao) || 0, concluida: !!it.concluida, atualizadoEm: Number(it.atualizadoEm) || Date.now(), duracao: atual?.duracao || a.duracao || undefined });
  }
  if (novos.length) await DB.putVarios('progresso', novos);
  await dialogo({ titulo: 'Progresso importado', html: `<p>${casados} de ${dados.itens.length} aulas encontradas neste aparelho; ${novos.length} atualizadas.</p>${casados < dados.itens.length ? '<p>As demais são de cursos que ainda não foram importados aqui (o nome do zip precisa ser o mesmo).</p>' : ''}` });
  rerenderizar();
}

async function apagarTudo() {
  const ok = await confirmar('Apagar tudo?', '<p>Todos os cursos, vídeos e progresso serão removidos deste aparelho. Não dá para desfazer.</p>', 'Apagar tudo', true);
  if (!ok) return;
  const certeza = await confirmar('Tem certeza?', '<p>Última confirmação: apagar <b>todos</b> os dados?</p>', 'Sim, apagar tudo', true);
  if (!certeza) return;
  Player.sair();
  Processador.fila = []; Processador.ids.clear();
  await DB.limparTudo();
  await OPFS.apagarTudo();
  for (const id of [...urlsCapa.keys()]) esquecerCapa(id);
  esquecerMinis([...urlsMini.keys()]);
  estadoCurso.clear();
  toast('Tudo apagado');
  location.replace('#/');
  rerenderizar();
}

/* =========================================================
   Eventos globais
   ========================================================= */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-acao]');
  if (!el) return;
  const acao = el.dataset.acao, id = el.dataset.id;
  if (el.closest('summary')) e.preventDefault(); // botão no cabeçalho do módulo não abre/fecha
  switch (acao) {
    case 'importar': menuImportar(); break;
    case 'voltar': voltar('#/'); break;
    case 'abrir-curso': location.hash = '#/curso/' + encodeURIComponent(id); break;
    case 'assistir':
      if (Player.ativo) Player.irPara({ id });
      else location.hash = '#/assistir/' + encodeURIComponent(id);
      break;
    case 'alternar-concluida': alternarConcluida(id); break;
    case 'apagar-curso': apagarCurso(id); break;
    case 'renomear-curso': renomearCurso(id); break;
    case 'apagar-modulo': apagarModulo(id, decodeURIComponent(el.dataset.modulo)); break;
    case 'filtro-bib': filtroBib = el.dataset.valor; rerenderizar(); break;
    case 'filtro-ep': {
      const est = estadoCurso.get(id);
      if (est) est.filtro = el.dataset.valor;
      $('.lista-eps').dataset.filtro = el.dataset.valor;
      if (est && el.dataset.valor !== 'todas') $$('.modulo').forEach((d) => { d.open = true; est.abertos.add(d.dataset.modulo); });
      $$('[data-acao="filtro-ep"]').forEach((c) => c.classList.toggle('ativo', c === el));
      break;
    }
    case 'rolar': {
      const f = el.parentElement.querySelector('.fileira');
      f.scrollBy({ left: +el.dataset.dir * f.clientWidth * 0.85, behavior: 'smooth' });
      break;
    }
    case 'persistir': {
      let ok = false;
      try { ok = await navigator.storage.persist(); } catch (x) {}
      toast(ok ? 'Armazenamento persistente ativado' : 'O navegador não confirmou. No iPhone, instale o app na Tela de Início.');
      rerenderizar();
      break;
    }
    case 'exportar-progresso': exportarProgresso(); break;
    case 'importar-progresso': $('#inp-json').click(); break;
    case 'apagar-tudo': apagarTudo(); break;
    // Player
    case 'fechar-player': Player.fechar(); break;
    case 'pl-voltar10': Player.pular(-10); break;
    case 'pl-avancar10': Player.pular(10); break;
    case 'pl-velocidade': Player.trocarVelocidade(); break;
    case 'pl-anterior': Player.irPara(Player.vizinha(-1)); break;
    case 'pl-proxima': Player.irPara(Player.vizinha(1)); break;
    case 'pl-concluida': Player.alternarConcluida(); break;
    case 'cont-agora': { const p = Player.vizinha(1); Player.pararContagem(); Player.irPara(p); break; }
    case 'cont-cancelar': Player.pararContagem(); break;
  }
});

$('#inp-zip').addEventListener('change', async (e) => {
  const files = [...e.target.files];
  e.target.value = '';
  if (files.length) await Importador.deZips(files);
});
$('#inp-pasta').addEventListener('change', async (e) => {
  const files = [...e.target.files];
  e.target.value = '';
  if (files.length) await Importador.dePasta(files);
});
$('#inp-json').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  e.target.value = '';
  if (f) await importarProgresso(f);
});

// Teclado (PC): ←/→ 10 s, espaço pausa, F tela cheia, N próximo, Esc fecha
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const fundos = $$('.modal-fundo');
    const topo = fundos[fundos.length - 1];
    if (topo) { if (topo._modal?.fechavel) topo.dispatchEvent(new Event('fechar')); return; }
    if (Player.ativo && !document.fullscreenElement) { Player.fechar(); return; }
  }
  if (!Player.ativo || $('.modal-fundo') || e.target.closest('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey) return;
  const v = Player.v;
  if (e.key === 'ArrowLeft') { Player.pular(-10); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { Player.pular(10); e.preventDefault(); }
  else if (e.key === ' ' || e.key === 'k') { if (e.target === v) return; v.paused ? v.play() : v.pause(); e.preventDefault(); }
  else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : v.requestFullscreen?.(); }
  else if (e.key === 'n' || e.key === 'N') Player.irPara(Player.vizinha(1));
});

// Arrastar e soltar zips (PC)
let contadorArraste = 0;
window.addEventListener('dragenter', (e) => {
  if (!e.dataTransfer?.types?.includes('Files') || importando) return;
  contadorArraste++;
  if (!$('.soltar')) { const d = document.createElement('div'); d.className = 'soltar'; d.textContent = 'Solte os arquivos .zip para importar'; document.body.appendChild(d); }
});
window.addEventListener('dragleave', () => { if (--contadorArraste <= 0) { contadorArraste = 0; $('.soltar')?.remove(); } });
window.addEventListener('dragover', (e) => { if (e.dataTransfer?.types?.includes('Files')) e.preventDefault(); });
window.addEventListener('drop', (e) => {
  e.preventDefault();
  contadorArraste = 0; $('.soltar')?.remove();
  if (importando) return;
  const zips = [...(e.dataTransfer?.files || [])].filter((f) => /\.zip$/i.test(f.name));
  if (zips.length) Importador.deZips(zips); else toast('Solte arquivos .zip');
});

window.addEventListener('beforeunload', (e) => { if (importando) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) Processador.rodar(); });

/* =========================================================
   Inicialização
   ========================================================= */
$$('[data-icone]').forEach((el) => el.insertAdjacentHTML('afterbegin', ICONE[el.dataset.icone]));
Player.init();

// Migração: títulos de aulas importadas antes da limpeza dos números ("2_Conhecendo..." → "Conhecendo...")
async function migrarDados() {
  if (lerPref('versaoDados', 1) >= 2) return;
  const aulas = await DB.todos('aulas');
  for (const a of aulas) {
    const partes = a.origem.split('/');
    a.titulo = [...partes.slice(1, -1), limparTitulo(partes[partes.length - 1])].join(' › ');
  }
  if (aulas.length) await DB.putVarios('aulas', aulas);
  salvarPref('versaoDados', 2);
}

DB.abrir().then(() => migrarDados().catch(() => {})).then(() => rotear()).catch((err) => {
  app.innerHTML = `<div class="pagina"><h1 class="pagina-titulo">Erro ao abrir o banco de dados</h1><p>${esc(err?.message || err)}</p><p>Se estiver em aba anônima/privada, abra em uma aba normal.</p></div>`;
});

// Instalado como app: pede armazenamento persistente logo de cara (o sistema não apaga os vídeos)
if (SUPORTE.instalado && navigator.storage?.persist) navigator.storage.persist().catch(() => {});

if ('serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW:', e)));
}

// Exposto só para depuração no console
window.App = { DB, OPFS, ZIP, planejar, Importador, Player, Processador };
</script>
